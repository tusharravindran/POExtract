services:
  - type: web
    name: poextract-app
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: poextract-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: poextract-db
    region: oregon

